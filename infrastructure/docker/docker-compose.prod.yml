services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: paideon-api:deployment
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:?Set DB_USER}:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/${DB_NAME:?Set DB_NAME}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      PORTAL_URL: https://${DOMAIN:?Set DOMAIN}
      TRUST_PROXY: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: paideon-api:deployment
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command:
      [
        "./packages/database/node_modules/.bin/prisma",
        "migrate",
        "deploy",
        "--schema",
        "packages/database/prisma/schema.prisma"
      ]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:?Set DB_USER}:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/${DB_NAME:?Set DB_NAME}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    build:
      context: ../..
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - portal

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
